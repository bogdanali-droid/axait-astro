    get stats() {
      const total = this.departments.reduce((s,d) => s + d.agents.length, 0);
      const leads = this.departments.reduce((s,d) => s + d.agents.filter(a => a.isLead).length, 0);
      const news = this.departments.reduce((s,d) => s + d.agents.filter(a => a.isNew).length, 0);
      return [
        { value: total, label: 'Agenti totali', color: 'text-blue-600 dark:text-blue-400' },
        { value: this.departments.length, label: 'Departamente', color: 'text-purple-600 dark:text-purple-400' },
        { value: leads, label: 'Leads', color: 'text-amber-600 dark:text-amber-400' },
        { value: news, label: 'Noi', color: 'text-emerald-600 dark:text-emerald-400' },
      ];
    },
    get filteredDepartments() { return this.filterDept ? this.departments.filter(d => d.id === this.filterDept) : this.departments; },
    filterAgents(agents) {
      if (!this.search.trim()) return agents;
      const q = this.search.toLowerCase();
      return agents.filter(a => a.id.toLowerCase().includes(q) || a.name.toLowerCase().includes(q) || (a.role || '').toLowerCase().includes(q) || (a.description || '').toLowerCase().includes(q) || (a.tags || []).some(t => t.toLowerCase().includes(q)) || (a.expertise || []).some(e => e.toLowerCase().includes(q)));
    },
    openAgent(agent, dept) { this.selected = agent; this.selectedDept = dept; },
